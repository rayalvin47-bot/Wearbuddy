// ==========================================
// 2. COLOR HARMONY & STYLING ENGINE
// ==========================================

class SmartStylingEngine {
  constructor() {
    this.neutralColors = ['black', 'white', 'gray', 'navy', 'beige', 'cream', 'denim', 'brown'];
    this.complementaryPairs = {
      blue: ['brown', 'beige', 'yellow', 'white', 'orange'],
      'light blue': ['navy', 'brown', 'beige', 'white'],
      navy: ['white', 'beige', 'light blue', 'red', 'cream'],
      red: ['black', 'white', 'navy', 'denim'],
      burgundy: ['black', 'cream', 'navy', 'beige'],
      green: ['beige', 'brown', 'white', 'black'],
      olive: ['cream', 'black', 'white', 'denim', 'beige'],
      pink: ['gray', 'white', 'denim', 'navy'],
      yellow: ['blue', 'navy', 'gray', 'black'],
      purple: ['gray', 'white', 'black'],
    };
  }

  evaluateColorHarmony(colors) {
    if (colors.length <= 1) return { score: 100, reason: 'Single tone.' };
    const nonNeutrals = colors.filter(c => !this.neutralColors.includes(c));
    if (nonNeutrals.length === 0) return { score: 95, reason: 'Versatile neutral palette.' };
    if (nonNeutrals.length === 1) return { score: 90, reason: 'Balanced pop of color with neutral baseline.' };
    const uniqueNonNeutrals = Array.from(new Set(nonNeutrals));
    if (uniqueNonNeutrals.length === 1) return { score: 88, reason: 'Monochromatic tone-on-tone combo.' };
    const c1 = uniqueNonNeutrals[0];
    const c2 = uniqueNonNeutrals[1];
    if (this.complementaryPairs[c1]?.includes(c2) || this.complementaryPairs[c2]?.includes(c1)) {
      return { score: 92, reason: `Harmonious accent pairing (${c1} & ${c2}).` };
    }
    if (uniqueNonNeutrals.length >= 3) return { score: 55, reason: 'Multiple bold non-neutral colors might clash.' };
    return { score: 75, reason: 'Standard color contrast.' };
  }

  calculateTemperatureWarmthTarget(tempC) {
    if (tempC <= 5) return 5;
    if (tempC <= 12) return 4;
    if (tempC <= 18) return 3;
    if (tempC <= 24) return 2;
    return 1;
  }

  generateRecommendations(wardrobe, profile, options) {
    const tops = wardrobe.filter(i => i.category === 'tops');
    const bottoms = wardrobe.filter(i => i.category === 'bottoms');
    const dresses = wardrobe.filter(i => i.category === 'dresses');
    const shoes = wardrobe.filter(i => i.category === 'shoes');
    const outerwear = wardrobe.filter(i => i.category === 'outerwear');

    if ((tops.length === 0 || bottoms.length === 0) && dresses.length === 0) return [];

    const targetWarmth = options.temperature !== undefined
      ? this.calculateTemperatureWarmthTarget(options.temperature) : 2;

    const generatedOutfits = [];

    const evaluateCombination = (selectedItems) => {
      const itemIds = selectedItems.map(i => i.id);
      const colors = selectedItems.map(i => i.color);
      const colorEval = this.evaluateColorHarmony(colors);

      const avgWarmth = selectedItems.reduce((acc, i) => acc + i.warmth, 0) / selectedItems.length;
      const warmthDiff = Math.abs(avgWarmth - targetWarmth);
      const weatherScore = Math.max(20, 100 - warmthDiff * 25);

      const occasionMatches = selectedItems.filter(i => i.occasions.includes(options.occasion)).length;
      const occasionScore = Math.round((occasionMatches / selectedItems.length) * 100);

      let styleScore = 80;
      if (options.styleVibe && options.styleVibe !== 'surprise') {
        const styleMatches = selectedItems.filter(i => i.styles.includes(options.styleVibe)).length;
        styleScore = Math.round((styleMatches / selectedItems.length) * 100);
      }

      const avgWears = selectedItems.reduce((acc, i) => acc + i.wearCount, 0) / selectedItems.length;
      const varietyScore = Math.max(30, Math.round(100 - avgWears * 5));

      const matchScore = Math.round(
        weatherScore * 0.30 + occasionScore * 0.25 + colorEval.score * 0.25 +
        styleScore * 0.10 + varietyScore * 0.10
      );

      const explanation = [
        colorEval.reason,
        `Matched for ${options.occasion} occasion.`,
        warmthDiff <= 1 ? 'Optimal layer warmth for climate.' : 'Suitable temperature baseline.'
      ];

      return {
        id: `rec_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`,
        name: `${selectedItems[0].name} & ${selectedItems[1].name} Combo`,
        itemIds,
        occasion: options.occasion,
        style: (options.styleVibe && options.styleVibe !== 'surprise') ? options.styleVibe : 'casual',
        matchScore,
        explanation,
        scoreBreakdown: {
          weather: weatherScore, occasion: occasionScore, color: colorEval.score,
          style: styleScore, variety: varietyScore,
        },
        createdAt: new Date().toISOString()
      };
    };

    tops.slice(0, 5).forEach(top => {
      bottoms.slice(0, 5).forEach(bottom => {
        const availableShoes = shoes.length > 0 ? shoes[0] : null;
        const combo = [top, bottom];
        if (availableShoes) combo.push(availableShoes);
        if (targetWarmth >= 4 && outerwear.length > 0) combo.push(outerwear[0]);
        generatedOutfits.push(evaluateCombination(combo));
      });
    });

    return generatedOutfits.sort((a, b) => b.matchScore - a.matchScore).slice(0, 3);
  }
}

// 3. WARDROBE CONTEXT & PERSISTENCE
// ==========================================

const WardrobeContext = createContext(undefined);
const FREE_ITEM_LIMIT = 30;
const DAILY_GENERATION_LIMIT = 2;

const WardrobeProvider = ({ children }) => {
  const [wardrobe, setWardrobe] = useState(() => {
    const saved = localStorage.getItem('wearbuddy_wardrobe');
    return saved ? JSON.parse(saved) : INITIAL_DEMO_WARDROBE;
  });
  const [savedOutfits, setSavedOutfits] = useState(() => {
    const saved = localStorage.getItem('wearbuddy_outfits');
    return saved ? JSON.parse(saved) : [];
  });
  const [wearLogs, setWearLogs] = useState(() => {
    const saved = localStorage.getItem('wearbuddy_wear_logs');
    return saved ? JSON.parse(saved) : [];
  });
  const [trips, setTrips] = useState(() => {
    const saved = localStorage.getItem('wearbuddy_trips');
    return saved ? JSON.parse(saved) : [];
  });
  const [wishlist, setWishlist] = useState(() => {
    const saved = localStorage.getItem('wearbuddy_wishlist');
    return saved ? JSON.parse(saved) : [];
  });
  const [profile] = useState({
    name: 'Alvin', stylePreferences: ['minimal', 'casual'], defaultOccasion: 'casual', avoidRepeats: true,
  });
  const [isPro, setIsPro] = useState(() => localStorage.getItem('wearbuddy_is_pro') === 'true');
  const [dailyGenerationsCount, setDailyGenerationsCount] = useState(() =>
    Number(localStorage.getItem('wearbuddy_daily_gens') || 0));

  useEffect(() => { localStorage.setItem('wearbuddy_wardrobe', JSON.stringify(wardrobe)); }, [wardrobe]);
  useEffect(() => { localStorage.setItem('wearbuddy_outfits', JSON.stringify(savedOutfits)); }, [savedOutfits]);
  useEffect(() => { localStorage.setItem('wearbuddy_wear_logs', JSON.stringify(wearLogs)); }, [wearLogs]);
  useEffect(() => { localStorage.setItem('wearbuddy_trips', JSON.stringify(trips)); }, [trips]);
  useEffect(() => { localStorage.setItem('wearbuddy_wishlist', JSON.stringify(wishlist)); }, [wishlist]);

  const upgradeToPro = () => { setIsPro(true); localStorage.setItem('wearbuddy_is_pro', 'true'); };

  // Called only from PayPal's onApprove callback — i.e. only after
  // the buyer has actually approved the subscription with PayPal.
  const confirmSubscription = (subscriptionId) => {
    setIsPro(true);
    localStorage.setItem('wearbuddy_is_pro', 'true');
    localStorage.setItem('wearbuddy_subscription_id', subscriptionId);
  };
  const incrementGenerationCount = () => {
    const nextCount = dailyGenerationsCount + 1;
    setDailyGenerationsCount(nextCount);
    localStorage.setItem('wearbuddy_daily_gens', nextCount.toString());
  };

  const canAddItem = isPro || wardrobe.length < FREE_ITEM_LIMIT;
  const canGenerateOutfits = isPro || dailyGenerationsCount < DAILY_GENERATION_LIMIT;

  const addItem = (newItemData) => {
    if (!canAddItem) return;
    const newItem = { ...newItemData, id: `item_${Date.now()}`, wearCount: 0, createdAt: new Date().toISOString() };
    setWardrobe((prev) => [newItem, ...prev]);
  };

  const deleteItem = (id) => setWardrobe((prev) => prev.filter((item) => item.id !== id));
  const toggleFavorite = (id) => setWardrobe((prev) =>
    prev.map((item) => (item.id === id ? { ...item, favorite: !item.favorite } : item)));

  const logWear = (itemIds, occasion) => {
    const today = new Date().toISOString().split('T')[0];
    const newLog = { id: `log_${Date.now()}`, date: today, itemIds, occasion };
    setWearLogs((prev) => [newLog, ...prev]);
    setWardrobe((prev) => prev.map((item) =>
      itemIds.includes(item.id) ? { ...item, wearCount: item.wearCount + 1, lastWorn: today } : item));
  };

  const saveOutfit = (outfit) => setSavedOutfits((prev) =>
    prev.some((o) => o.id === outfit.id) ? prev : [outfit, ...prev]);

  const addTrip = (tripData) => {
    const suggested = wardrobe
      .filter((i) => i.occasions.includes(tripData.tripType) || i.category === 'shoes' || i.category === 'tops')
      .map((i) => i.id).slice(0, 8);
    const newTrip = { ...tripData, id: `trip_${Date.now()}`, suggestedItemIds: suggested, packedItemIds: [] };
    setTrips((prev) => [newTrip, ...prev]);
  };

  const togglePackItem = (tripId, itemId) => {
    setTrips((prev) => prev.map((trip) => {
      if (trip.id !== tripId) return trip;
      const isPacked = trip.packedItemIds.includes(itemId);
      return {
        ...trip,
        packedItemIds: isPacked ? trip.packedItemIds.filter((id) => id !== itemId) : [...trip.packedItemIds, itemId],
      };
    }));
  };

  const addWishlistItem = (itemData) => {
    const similar = wardrobe.filter((i) => i.category === itemData.category).map((i) => i.id);
    const newItem = { ...itemData, id: `wish_${Date.now()}`, similarItemIdsInCloset: similar };
    setWishlist((prev) => [newItem, ...prev]);
  };

  const resetToDemo = () => {
    setWardrobe(INITIAL_DEMO_WARDROBE);
    setSavedOutfits([]); setWearLogs([]); setTrips([]); setWishlist([]);
    localStorage.clear();
  };

  return (
    <WardrobeContext.Provider value={{
      wardrobe, savedOutfits, wearLogs, trips, wishlist, profile,
      addItem, deleteItem, toggleFavorite, logWear, saveOutfit, addTrip, togglePackItem, addWishlistItem, resetToDemo,
      isPro, upgradeToPro, confirmSubscription, canAddItem, canGenerateOutfits, dailyGenerationsCount, incrementGenerationCount,
    }}>
      {children}
    </WardrobeContext.Provider>
  );
};

const useWardrobe = () => {
  const context = useContext(WardrobeContext);
  if (!context) throw new Error('useWardrobe must be used within a WardrobeProvider');
  return context;
};

const PAYPAL_CLIENT_ID = "BAACN6goTr8-n1aRr5D_XpFu_czsF2PGc0iN-FhGoxgbuQt2C4BpOj0LjaKrjgNo2pC7LSKfCbs3Yybnn4";
const PAYPAL_PLAN_ID = "P-7KN903420B0003442NKBA3KQ";

// Loads the PayPal JS SDK exactly once, no matter how many times
// the paywall is opened/closed.
let paypalSdkPromise = null;
function loadPaypalSdk() {
  if (window.paypal) return Promise.resolve(window.paypal);
  if (paypalSdkPromise) return paypalSdkPromise;
  paypalSdkPromise = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = `https://www.paypal.com/sdk/js?client-id=${PAYPAL_CLIENT_ID}&vault=true&intent=subscription`;
    script.onload = () => resolve(window.paypal);
    script.onerror = () => reject(new Error('Failed to load PayPal SDK'));
    document.head.appendChild(script);
  });
  return paypalSdkPromise;
}

const PaywallModal = ({ isOpen, onClose, triggerReason }) => {
  const { confirmSubscription } = useWardrobe();
  const buttonContainerRef = React.useRef(null);
  const [sdkError, setSdkError] = useState(null);

  useEffect(() => {
    if (!isOpen) return;
    let cancelled = false;

    loadPaypalSdk()
      .then((paypal) => {
        if (cancelled || !buttonContainerRef.current) return;
        buttonContainerRef.current.innerHTML = ''; // avoid double-render on reopen

        paypal.Buttons({
          style: { shape: 'pill', color: 'blue', layout: 'vertical', label: 'subscribe' },
          createSubscription: (data, actions) => {
            return actions.subscription.create({ plan_id: PAYPAL_PLAN_ID });
          },
          onApprove: (data) => {
            // This only fires after the buyer has actually approved
            // the subscription with PayPal — this is the ONE place
            // Pro access gets granted.
            confirmSubscription(data.subscriptionID);
            onClose();
          },
          onError: (err) => {
            console.error('PayPal subscription error:', err);
            setSdkError('Something went wrong with PayPal. Please try again.');
          },
        }).render(buttonContainerRef.current);
      })
      .catch(() => setSdkError('Could not load PayPal. Check your connection and try again.'));

    return () => { cancelled = true; };
  }, [isOpen]);

  if (!isOpen) return null;

  return (
    <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4">
      <div className="bg-white rounded-3xl w-full max-w-md overflow-hidden shadow-2xl border border-slate-100">
        <div className="bg-gradient-to-r from-amber-500 to-indigo-600 p-6 text-white text-center relative">
          <button onClick={onClose} className="absolute top-4 right-4 p-1.5 bg-black/20 hover:bg-black/40 rounded-full text-white transition-colors">
            <X size={18} />
          </button>
          <div className="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center mx-auto mb-3 backdrop-blur-md">
            <Crown size={28} className="text-amber-200" />
          </div>
          <h3 className="text-2xl font-black">WearBuddy Pro</h3>
          <p className="text-xs text-amber-100 mt-1">Unlock your complete digital wardrobe</p>
        </div>
        <div className="p-6 space-y-5">
          {triggerReason && (
            <div className="bg-amber-50 border border-amber-200 p-3 rounded-2xl text-xs font-semibold text-amber-900 text-center">
              ⚠️ {triggerReason}
            </div>
          )}
          <div className="text-center bg-slate-50 border border-slate-100 p-4 rounded-2xl">
            <span className="text-3xl font-black text-slate-900">$4.99</span>
            <span className="text-xs font-bold text-slate-500"> / month</span>
            <div className="flex items-center justify-center space-x-1 text-[11px] text-indigo-600 font-semibold mt-1">
              <Calendar size={13} />
              <span>Auto-renews monthly · Cancel anytime</span>
            </div>
          </div>
          <div className="space-y-2 text-xs text-slate-700">
            {[
              'Unlimited closet uploads (30-item free limit removed)',
              'Unlimited "Style My Day" AI fit generation',
              'Unlimited travel packing lists & trip planner',
              'Cost-Per-Wear analytics & price tracking',
              'Wishlist Gap Analyzer (prevent duplicate buys)',
            ].map((feat, idx) => (
              <div key={idx} className="flex items-center space-x-2.5">

      <PaywallModal isOpen={isPaywallOpen} onClose={() => setIsPaywallOpen(false)} triggerReason="You've reached your free daily limit of AI outfit generations! Upgrade to Pro for unlimited recommendations." />

const ClosetScreen = () => {
  const { wardrobe, addItem, deleteItem, toggleFavorite, canAddItem } = useWardrobe();

  const [searchQuery, setSearchQuery] = useState('');
  const [selectedCategory, setSelectedCategory] = useState('all');
  const [sortBy, setSortBy] = useState('recent');
  const [selectedItem, setSelectedItem] = useState(null);
  const [isAddModalOpen, setIsAddModalOpen] = useState(false);
  const [isPaywallOpen, setIsPaywallOpen] = useState(false);

  const [name, setName] = useState('');
  const [category, setCategory] = useState('tops');
  const [color, setColor] = useState('black');
  const [imageUrl, setImageUrl] = useState('');
  const [price, setPrice] = useState('');

  const categories = [
    { label: 'All Items', value: 'all' },
    { label: 'Tops', value: 'tops' },
    { label: 'Bottoms', value: 'bottoms' },
    { label: 'Dresses', value: 'dresses' },
    { label: 'Outerwear', value: 'outerwear' },
    { label: 'Shoes', value: 'shoes' },
    { label: 'Bags', value: 'bags' },
    { label: 'Accessories', value: 'accessories' },
  ];

  const colorsList = ['black', 'white', 'gray', 'navy', 'blue', 'light blue', 'red', 'green', 'olive', 'brown', 'beige', 'cream', 'denim'];

  const filteredItems = useMemo(() => {
    return wardrobe
      .filter((item) => {
        const matchesCategory = selectedCategory === 'all' || item.category === selectedCategory;
        const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.color.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      })
      .sort((a, b) => {
        if (sortBy === 'most-worn') return b.wearCount - a.wearCount;
        if (sortBy === 'least-worn') return a.wearCount - b.wearCount;
        if (sortBy === 'cost-per-wear') {
          const cpwA = a.purchasePrice ? a.purchasePrice / Math.max(1, a.wearCount) : 0;
          const cpwB = b.purchasePrice ? b.purchasePrice / Math.max(1, b.wearCount) : 0;
          return cpwB - cpwA;
        }
        return new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime();
      });
  }, [wardrobe, selectedCategory, searchQuery, sortBy]);

  const handleOpenAddModal = () => {
    if (!canAddItem) { setIsPaywallOpen(true); return; }
    setIsAddModalOpen(true);
  };

  const handleCreateItem = (e) => {
    e.preventDefault();
    if (!name.trim()) return;
    addItem({
      name, category,
      subcategory: category === 'tops' ? 't-shirt' : category === 'bottoms' ? 'jeans' : 'sneakers',
      color,
      imageUrl: imageUrl.trim() || 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500&auto=format&fit=crop',
      seasons: ['spring', 'summer', 'fall', 'winter'],
      occasions: ['casual', 'school', 'work'],
      styles: ['casual', 'minimal'],
      formality: 2, warmth: 2,
      purchasePrice: price ? parseFloat(price) : undefined,
      favorite: false,
    });
    setName(''); setImageUrl(''); setPrice('');
    setIsAddModalOpen(false);
  };

  const calculateCostPerWear = (item) => {
    if (!item.purchasePrice) return null;
    return (item.purchasePrice / Math.max(1, item.wearCount)).toFixed(2);
  };

  return (
    <div className="space-y-6 pb-12">
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h2 className="text-3xl font-extrabold text-slate-900">My Closet</h2>
          <p className="text-xs text-slate-500 mt-1">Organized inventory • <strong>{wardrobe.length}</strong> items total</p>
        </div>
        <button onClick={handleOpenAddModal} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-3 rounded-2xl shadow-lg shadow-indigo-100 flex items-center justify-center space-x-2 transition-all self-start sm:self-auto">
          <Plus size={18} />
          <span>Add Clothing</span>
        </button>
      </div>

      <div className="space-y-4">
        <div className="flex flex-col sm:flex-row gap-3">
          <div className="relative flex-1">
            <Search className="absolute left-3.5 top-3.5 text-slate-400" size={18} />
            <input type="text" placeholder="Search by name or color..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full bg-white border border-slate-200 rounded-2xl pl-10 pr-4 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-xs" />
          </div>
          <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className="bg-white border border-slate-200 text-slate-700 text-xs font-medium rounded-2xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-xs">
            <option value="recent">Sort by Recently Added</option>
            <option value="most-worn">Sort by Most Worn</option>
            <option value="least-worn">Sort by Least Worn</option>
            <option value="cost-per-wear">Sort by Cost Per Wear</option>
          </select>
        </div>

        <div className="flex items-center space-x-2 overflow-x-auto pb-1">
          {categories.map((cat) => (
            <button key={cat.value} onClick={() => setSelectedCategory(cat.value)} className={`px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${selectedCategory === cat.value ? 'bg-slate-900 text-white shadow-xs' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'}`}>
              {cat.label}
            </button>
          ))}
        </div>
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
        {filteredItems.map((item) => {
          const cpw = calculateCostPerWear(item);
          return (
            <div key={item.id} onClick={() => setSelectedItem(item)} className="group bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xs hover:shadow-md transition-all cursor-pointer flex flex-col justify-between">
              <div className="relative aspect-square bg-slate-50 overflow-hidden">
                <img src={item.imageUrl} alt={item.name} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
                <button onClick={(e) => { e.stopPropagation(); toggleFavorite(item.id); }} className="absolute top-2 right-2 p-1.5 rounded-full bg-white/80 backdrop-blur-xs text-slate-600 hover:text-red-500 transition-colors">
                  <Heart size={16} className={item.favorite ? 'fill-red-500 text-red-500' : ''} />
                </button>
                <span className="absolute bottom-2 left-2 bg-slate-900/80 text-white text-[10px] px-2 py-0.5 rounded-md backdrop-blur-xs font-medium capitalize">
                  {item.color}
                </span>
              </div>
              <div className="p-3 space-y-1">
                <h4 className="font-bold text-slate-900 text-xs truncate">{item.name}</h4>
                <div className="flex items-center justify-between text-[10px] text-slate-500">
                  <span>Worn {item.wearCount}x</span>
                  {cpw && <span className="font-semibold text-emerald-600">${cpw}/wear</span>}
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {selectedItem && (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl w-full max-w-md overflow-hidden shadow-2xl border border-slate-100">
            <div className="relative h-64 bg-slate-100">
              <img src={selectedItem.imageUrl} alt={selectedItem.name} className="w-full h-full object-cover" />
              <button onClick={() => setSelectedItem(null)} className="absolute top-3 right-3 p-2 bg-white/80 backdrop-blur-md rounded-full text-slate-700 hover:bg-white">
                <X size={18} />
              </button>
            </div>
            <div className="p-6 space-y-4">
              <div>
                <span className="text-[10px] font-bold uppercase tracking-wider text-indigo-600">
                  {selectedItem.category} • {selectedItem.subcategory}
                </span>
                <h3 className="text-xl font-extrabold text-slate-900">{selectedItem.name}</h3>
              </div>
              <div className="grid grid-cols-2 gap-3 bg-slate-50 p-4 rounded-2xl border border-slate-100">
                <div>
                  <span className="text-[10px] font-medium text-slate-400 block">Total Wears</span>
                  <span className="text-lg font-bold text-slate-800">{selectedItem.wearCount} times</span>
                </div>
                <div>
                  <span className="text-[10px] font-medium text-slate-400 block">Cost Per Wear</span>
                  <span className="text-lg font-bold text-emerald-600">
                    {calculateCostPerWear(selectedItem) ? `$${calculateCostPerWear(selectedItem)}` : 'N/A'}
                  </span>
                </div>
              </div>
              <div className="pt-2 flex justify-between items-center">
                <button onClick={() => { deleteItem(selectedItem.id); setSelectedItem(null); }} className="text-xs text-red-600 hover:text-red-800 font-bold flex items-center space-x-1">
                  <Trash2 size={16} />
                  <span>Remove Item</span>
                </button>
                <button onClick={() => setSelectedItem(null)} className="bg-slate-900 text-white text-xs font-bold px-5 py-2.5 rounded-xl">Close</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {isAddModalOpen && (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl w-full max-w-lg overflow-hidden shadow-2xl border border-slate-100">
            <div className="p-6 border-b border-slate-100 flex items-center justify-between">
              <div>
                <h3 className="text-xl font-extrabold text-slate-900">Add Clothing</h3>
                <p className="text-xs text-slate-500">Quickly digitize your wardrobe</p>
              </div>
              <button onClick={() => setIsAddModalOpen(false)} className="p-2 text-slate-400 hover:text-slate-600 rounded-full">
                <X size={20} />

              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-bold text-slate-700 uppercase tracking-wider block mb-1">Category</label>
                  <select value={category} onChange={(e) => setCategory(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-3 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="tops">Tops</option>
                    <option value="bottoms">Bottoms</option>
                    <option value="dresses">Dresses</option>
                    <option value="outerwear">Outerwear</option>
                    <option value="shoes">Shoes</option>
                    <option value="accessories">Accessories</option>
                  </select>

                  <label className="text-xs font-bold text-slate-700 uppercase tracking-wider block mb-1">Main Color</label>
                  <select value={color} onChange={(e) => setColor(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-3 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 capitalize">
                    {colorsList.map((c) => (<option key={c} value={c}>{c}</option>))}

              </div>
              <div>
                <label className="text-xs font-bold text-slate-700 uppercase tracking-wider block mb-1">Purchase Price ($)</label>
                <input type="number" placeholder="e.g. 50" value={price} onChange={(e) => setPrice(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500" />
              </div>
              <div className="pt-3">
                <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-indigo-100 flex items-center justify-center space-x-2">
                  <Check size={18} />
                  <span>Save to Closet</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      )}

      <PaywallModal isOpen={isPaywallOpen} onClose={() => setIsPaywallOpen(false)} triggerReason="Free limit reached! You have 30 items in your closet. Upgrade to Pro for unlimited uploads." />
    </div>
  );
};

// ==========================================
// 8. OUTFIT BUILDER, CALENDAR & TRIP PLANNER
// ==========================================

const OutfitsAndPlannerScreen = () => {
  const { wardrobe, savedOutfits, saveOutfit, logWear, wishlist, addWishlistItem, trips, addTrip, togglePackItem } = useWardrobe();

  const [activeSubTab, setActiveSubTab] = useState('builder');
  const [selectedTopId, setSelectedTopId] = useState('');
  const [selectedBottomId, setSelectedBottomId] = useState('');
  const [selectedShoesId, setSelectedShoesId] = useState('');
  const [selectedOuterwearId, setSelectedOuterwearId] = useState('');
  const [outfitName, setOutfitName] = useState('');

  const [isTripModalOpen, setIsTripModalOpen] = useState(false);
  const [destination, setDestination] = useState('');
  const [startDate, setStartDate] = useState('');
  const [endDate, setEndDate] = useState('');
  const [tripType, setTripType] = useState('travel');
  const [climate, setClimate] = useState('mild');

  const [isWishlistModalOpen, setIsWishlistModalOpen] = useState(false);
  const [wishName, setWishName] = useState('');
  const [wishCategory, setWishCategory] = useState('tops');
  const [wishPrice, setWishPrice] = useState('');

  const tops = wardrobe.filter(i => i.category === 'tops');
  const bottoms = wardrobe.filter(i => i.category === 'bottoms');
  const shoes = wardrobe.filter(i => i.category === 'shoes');
  const outerwear = wardrobe.filter(i => i.category === 'outerwear');

  const handleSurpriseMe = () => {
    if (tops.length === 0 || bottoms.length === 0 || shoes.length === 0) return;
    setSelectedTopId(tops[Math.floor(Math.random() * tops.length)].id);
    setSelectedBottomId(bottoms[Math.floor(Math.random() * bottoms.length)].id);
    setSelectedShoesId(shoes[Math.floor(Math.random() * shoes.length)].id);
  };

  const handleSaveCustomOutfit = (e) => {
    e.preventDefault();
    const itemIds = [selectedTopId, selectedBottomId, selectedShoesId, selectedOuterwearId].filter(Boolean);
    if (itemIds.length < 2) return;
    const newOutfit = {
      id: `custom_${Date.now()}`, name: outfitName || 'Custom Combination', itemIds,
      occasion: 'casual', style: 'casual', matchScore: 90,
      explanation: ['Custom styled combination directly from your wardrobe.'],
      scoreBreakdown: { weather: 90, occasion: 90, color: 90, style: 90, variety: 90 },
      createdAt: new Date().toISOString(),
    };
    saveOutfit(newOutfit);
    setOutfitName(''); setSelectedTopId(''); setSelectedBottomId(''); setSelectedShoesId(''); setSelectedOuterwearId('');
  };

  const handleCreateTrip = (e) => {
    e.preventDefault();
    if (!destination || !startDate || !endDate) return;
    addTrip({ destination, startDate, endDate, tripType, expectedClimate: climate });
    setDestination(''); setIsTripModalOpen(false);
  };

  const handleCreateWishlistItem = (e) => {
    e.preventDefault();
    if (!wishName) return;
    addWishlistItem({ name: wishName, category: wishCategory, price: wishPrice ? parseFloat(wishPrice) : undefined });
    setWishName(''); setWishPrice(''); setIsWishlistModalOpen(false);
  };

  return (
    <div className="space-y-6 pb-12">
      <div className="flex bg-slate-200/60 p-1.5 rounded-2xl max-w-md mx-auto sm:mx-0">
        {[
          { id: 'builder', label: 'Builder', icon: Layers },
          { id: 'calendar', label: 'Calendar', icon: Calendar },
          { id: 'trips', label: 'Trips', icon: Luggage },
          { id: 'wishlist', label: 'Wishlist', icon: ShoppingBag },
        ].map((tab) => {
          const Icon = tab.icon;
          const isActive = activeSubTab === tab.id;
          return (
            <button key={tab.id} onClick={() => setActiveSubTab(tab.id)} className={`flex-1 flex items-center justify-center space-x-1.5 py-2.5 rounded-xl text-xs font-bold transition-all ${isActive ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}>
              <Icon size={16} />
              <span>{tab.label}</span>
            </button>
          );
        })}
      </div>

      {activeSubTab === 'builder' && (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
          <form onSubmit={handleSaveCustomOutfit} className="bg-white p-6 rounded-3xl border border-slate-200 shadow-xs space-y-4">
            <div className="flex items-center justify-between">
              <h3 className="text-xl font-extrabold text-slate-900">Custom Outfit Builder</h3>
              <button type="button" onClick={handleSurpriseMe} className="text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-xl text-xs font-bold flex items-center space-x-1.5 transition-colors">
                <Shuffle size={14} />
                <span>Surprise Me</span>
              </button>
            </div>
            <div>
              <label className="text-xs font-bold text-slate-700 uppercase tracking-wider block mb-1">Outfit Name</label>
              <input type="text" placeholder="e.g. Friday Campus Fit" value={outfitName} onChange={(e) => setOutfitName(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>
            <div className="space-y-3">
              <div>
                <label className="text-xs font-semibold text-slate-600 block mb-1">Select Top</label>
                <select value={selectedTopId} onChange={(e) => setSelectedTopId(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs">
                  <option value="">-- Choose Top --</option>
                  {tops.map(t => <option key={t.id} value={t.id}>{t.name} ({t.color})</option>)}
                </select>
              </div>
              <div>
                <label className="text-xs font-semibold text-slate-600 block mb-1">Select Bottom</label>
                <select value={selectedBottomId} onChange={(e) => setSelectedBottomId(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs">
                  <option value="">-- Choose Bottom --</option>
                  {bottoms.map(b => <option key={b.id} value={b.id}>{b.name} ({b.color})</option>)}
                </select>
              </div>
              <div>
                <label className="text-xs font-semibold text-slate-600 block mb-1">Select Shoes</label>
                <select value={selectedShoesId} onChange={(e) => setSelectedShoesId(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs">
                  <option value="">-- Choose Shoes --</option>
                  {shoes.map(s => <option key={s.id} value={s.id}>{s.name} ({s.color})</option>)}
                </select>
              </div>
              <div>
                <label className="text-xs font-semibold text-slate-600 block mb-1">Select Outerwear (Optional)</label>
                <select value={selectedOuterwearId} onChange={(e) => setSelectedOuterwearId(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs">
                  <option value="">-- Optional Layer --</option>
                  {outerwear.map(o => <option key={o.id} value={o.id}>{o.name} ({o.color})</option>)}
                </select>
              </div>
            </div>
            <button type="submit" disabled={!selectedTopId || !selectedBottomId} className="w-full bg-slate-900 disabled:opacity-50 text-white font-bold py-3 rounded-2xl text-xs flex items-center justify-center space-x-2">
              <Check size={16} />
              <span>Save Outfit</span>
            </button>
          </form>

          <div className="space-y-4">
            <h3 className="text-xl font-extrabold text-slate-900">Saved Outfits ({savedOutfits.length})</h3>
            {savedOutfits.length === 0 ? (
              <div className="bg-slate-50 border border-slate-200/80 rounded-3xl p-8 text-center space-y-2">
                <p className="text-xs text-slate-500">No saved outfits yet. Build one on the left or save recommendations from your Home tab.</p>
              </div>
            ) : (
              <div className="space-y-3">
                {savedOutfits.map((outfit) => (
                  <div key={outfit.id} className="bg-white p-4 rounded-2xl border border-slate-200 flex items-center justify-between shadow-xs">
                    <div>
                      <h4 className="font-bold text-slate-900 text-sm">{outfit.name}</h4>
                      <p className="text-xs text-slate-500 mt-0.5">{outfit.itemIds.length} Items • Match Score {outfit.matchScore}/100</p>
                    </div>
                    <button onClick={() => logWear(outfit.itemIds, outfit.occasion)} className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-2 rounded-xl transition-colors">
                      Wear Today
                    </button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}

      {activeSubTab === 'calendar' && (
        <div className="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 shadow-xs space-y-6">
          <div className="flex items-center justify-between">
            <div>
              <h3 className="text-xl font-extrabold text-slate-900">Outfit Calendar</h3>
              <p className="text-xs text-slate-500">Track wear frequency and planned looks</p>
            </div>
            <span className="text-xs font-bold bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-full">August 2026</span>
          </div>
          <div className="grid grid-cols-7 gap-2 text-center text-xs font-bold text-slate-400 border-b border-slate-100 pb-2">
            <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
          </div>
          <div className="grid grid-cols-7 gap-2 text-xs">
            {Array.from({ length: 31 }).map((_, index) => {
              const day = index + 1;
              const isToday = day === 16;
              return (
                <div key={day} className={`h-20 p-2 rounded-2xl border flex flex-col justify-between transition-all ${isToday ? 'border-indigo-600 bg-indigo-50/50 font-bold' : 'border-slate-100 bg-slate-50/50'}`}>
                  <span className={`text-[10px] ${isToday ? 'text-indigo-600 font-extrabold' : 'text-slate-400'}`}>{day}</span>
                  {isToday && (<span className="bg-indigo-600 text-white text-[9px] px-1 py-0.5 rounded font-bold truncate">Today's Fit</span>)}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {activeSubTab === 'trips' && (
        <div className="space-y-6">
          <div className="flex items-center justify-between">
            <div>
              <h3 className="text-xl font-extrabold text-slate-900">Travel Packing Planner</h3>
              <p className="text-xs text-slate-500">Build trip checklists directly from what you own</p>
            </div>
            <button onClick={() => setIsTripModalOpen(true)} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2.5 rounded-2xl text-xs flex items-center space-x-1.5 shadow-xs">
              <Plus size={16} />
              <span>Plan New Trip</span>
            </button>
          </div>
          {trips.length === 0 ? (
            <div className="bg-slate-50 border border-slate-200 rounded-3xl p-8 text-center space-y-2">
              <Luggage size={32} className="mx-auto text-slate-400" />
              <p className="text-xs text-slate-500">No upcoming trips planned. Tap "Plan New Trip" to get automatically suggested packing lists!</p>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              {trips.map((trip) => (
                <div key={trip.id} className="bg-white p-6 rounded-3xl border border-slate-200 space-y-4 shadow-xs">
                  <div>
                    <span className="text-[10px] font-bold uppercase tracking-wider text-indigo-600">{trip.tripType} • {trip.expectedClimate} climate</span>
                    <h4 className="text-lg font-extrabold text-slate-900">{trip.destination}</h4>
                    <p className="text-xs text-slate-400">{trip.startDate} to {trip.endDate}</p>
                  </div>
                  <div className="space-y-2 border-t border-slate-100 pt-3">
                    <span className="text-xs font-bold text-slate-700 block mb-1">Suggested Packing Checklist</span>
                    {trip.suggestedItemIds.map((itemId) => {
                      const item = wardrobe.find(i => i.id === itemId);
                      if (!item) return null;
                      const isPacked = trip.packedItemIds.includes(itemId);
                      return (
                        <div key={itemId} onClick={() => togglePackItem(trip.id, itemId)} className="flex items-center space-x-2 text-xs text-slate-700 cursor-pointer hover:text-slate-900">
                          {isPacked ? <CheckSquare size={16} className="text-emerald-600" /> : <Square size={16} className="text-slate-300" />}
                          <span className={isPacked ? 'line-through text-slate-400' : ''}>{item.name} ({item.color})</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {activeSubTab === 'wishlist' && (
        <div className="space-y-6">
          <div className="flex items-center justify-between">
            <div>
              <h3 className="text-xl font-extrabold text-slate-900">Wishlist & Gap Analyzer</h3>
              <p className="text-xs text-slate-500">Avoid duplicate buys by cross-checking your closet</p>
            </div>
            <button onClick={() => setIsWishlistModalOpen(true)} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2.5 rounded-2xl text-xs flex items-center space-x-1.5 shadow-xs">
              <Plus size={16} />
              <span>Add Wishlist Item</span>
            </button>
          </div>
          {wishlist.length === 0 ? (
            <div className="bg-slate-50 border border-slate-200 rounded-3xl p-8 text-center space-y-2">
              <ShoppingBag size={32} className="mx-auto text-slate-400" />
              <p className="text-xs text-slate-500">Your wishlist is empty. Add items you're thinking of buying to check for closet overlaps.</p>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {wishlist.map((item) => {
                const similarCount = wardrobe.filter(i => i.category === item.category).length;
                return (
                  <div key={item.id} className="bg-white p-5 rounded-3xl border border-slate-200 space-y-3 shadow-xs">
                    <div className="flex items-start justify-between">
                      <div>
                        <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400">{item.category}</span>
                        <h4 className="font-extrabold text-slate-900 text-sm">{item.name}</h4>
                        {item.price && <span className="text-xs font-bold text-slate-700">${item.price}</span>}
                      </div>
                    </div>
                    <div className="bg-amber-50 border border-amber-200 p-3 rounded-2xl flex items-center space-x-2 text-amber-900 text-xs">
                      <AlertCircle size={18} className="shrink-0 text-amber-600" />
                      <span>Before you buy: You already own <strong>{similarCount}</strong> items in the {item.category} category.</span>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {isTripModalOpen && (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl w-full max-w-md p-6 space-y-4 shadow-2xl">
            <h3 className="text-xl font-extrabold text-slate-900">Plan Trip Checklist</h3>
            <form onSubmit={handleCreateTrip} className="space-y-3">
              <input type="text" required placeholder="Destination (e.g. Tokyo, Mombasa)" value={destination} onChange={(e) => setDestination(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs" />
              <div className="grid grid-cols-2 gap-2">
                <input type="date" required value={startDate} onChange={(e) => setStartDate(e.target.value)} className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs" />
                <input type="date" required value={endDate} onChange={(e) => setEndDate(e.target.value)} className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs" />
              </div>
              <div className="flex space-x-2 pt-2">
                <button type="button" onClick={() => setIsTripModalOpen(false)} className="w-1/2 bg-slate-100 py-2.5 rounded-xl text-xs font-bold">Cancel</button>
                <button type="submit" className="w-1/2 bg-indigo-600 text-white py-2.5 rounded-xl text-xs font-bold">Create Plan</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {isWishlistModalOpen && (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl w-full max-w-md p-6 space-y-4 shadow-2xl">
            <h3 className="text-xl font-extrabold text-slate-900">Add Wishlist Item</h3>
            <form onSubmit={handleCreateWishlistItem} className="space-y-3">
              <input type="text" required placeholder="Item Name (e.g. Black Leather Boots)" value={wishName} onChange={(e) => setWishName(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs" />
              <div className="grid grid-cols-2 gap-2">
                <select value={wishCategory} onChange={(e) => setWishCategory(e.target.value)} className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs">
                  <option value="tops">Tops</option>
                  <option value="bottoms">Bottoms</option>
                  <option value="shoes">Shoes</option>
                  <option value="outerwear">Outerwear</option>
                </select>
                <input type="number" placeholder="Price ($)" value={wishPrice} onChange={(e) => setWishPrice(e.target.value)} className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs" />
              </div>
              <div className="flex space-x-2 pt-2">
                <button type="button" onClick={() => setIsWishlistModalOpen(false)} className="w-1/2 bg-slate-100 py-2.5 rounded-xl text-xs font-bold">Cancel</button>
                <button type="submit" className="w-1/2 bg-indigo-600 text-white py-2.5 rounded-xl text-xs font-bold">Save Wish</button>
              </div>
            </form>
          </div>
        </div>
      )}
    </div>
  );
};

// ==========================================
// 9. ENTRY POINT
// ==========================================

const AppContent = () => {
  const [activeTab, setActiveTab] = useState('home');
  return (
    <Layout activeTab={activeTab} setActiveTab={setActiveTab}>
      {activeTab === 'home' && <HomeScreen />}
      {activeTab === 'closet' && <ClosetScreen />}
      {activeTab === 'add' && <ClosetScreen />}
      {activeTab === 'outfits' && <OutfitsAndPlannerScreen />}
      {activeTab === 'explore' && <OutfitsAndPlannerScreen />}
    </Layout>
  );
};

const App = () => (
  <WardrobeProvider>
    <AppContent />
  </WardrobeProvider>
);

const root = createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
